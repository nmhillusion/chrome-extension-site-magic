<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tileGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4c1d95"/>
      <stop offset="0.45" stop-color="#7c3aed"/>
      <stop offset="0.75" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="vThread" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="hThreadA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="hThreadB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="needleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <clipPath id="contentClip">
      <rect x="120" y="192" width="272" height="184" rx="14"/>
    </clipPath>
    <filter id="browserShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#tileGrad)"/>
  <rect x="32" y="32" width="448" height="448" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="4"/>

  <!-- Browser window -->
  <g filter="url(#browserShadow)">
    <rect x="96" y="120" width="320" height="280" rx="30" fill="url(#glassGrad)" stroke="#ffffff" stroke-width="5"/>
  </g>
  <circle cx="140" cy="150" r="12" fill="#2563eb"/>
  <circle cx="172" cy="150" r="12" fill="#7c3aed"/>
  <circle cx="204" cy="150" r="12" fill="#c026d3"/>

  <!-- Woven content -->
  <g clip-path="url(#contentClip)">
    <rect x="120" y="192" width="272" height="184" fill="#eff6ff"/>
    <!-- vertical threads -->
    <rect x="147" y="192" width="34" height="184" rx="10" fill="url(#vThread)"/>
    <rect x="208" y="192" width="34" height="184" rx="10" fill="url(#vThread)"/>
    <rect x="269" y="192" width="34" height="184" rx="10" fill="url(#vThread)"/>
    <rect x="330" y="192" width="34" height="184" rx="10" fill="url(#vThread)"/>
    <!-- horizontal threads -->
    <rect x="120" y="202" width="272" height="22" rx="11" fill="url(#hThreadA)"/>
    <rect x="120" y="238" width="272" height="22" rx="11" fill="url(#hThreadB)"/>
    <rect x="120" y="274" width="272" height="22" rx="11" fill="url(#hThreadA)"/>
    <rect x="120" y="310" width="272" height="22" rx="11" fill="url(#hThreadB)"/>
    <rect x="120" y="346" width="272" height="22" rx="11" fill="url(#hThreadA)"/>
    <!-- over-under: vertical patches on even crossings -->
    <g fill="url(#vThread)" stroke="#1d4ed8" stroke-width="1.5">
      <rect x="144" y="199" width="40" height="28" rx="9"/>
      <rect x="266" y="199" width="40" height="28" rx="9"/>
      <rect x="205" y="235" width="40" height="28" rx="9"/>
      <rect x="327" y="235" width="40" height="28" rx="9"/>
      <rect x="144" y="271" width="40" height="28" rx="9"/>
      <rect x="266" y="271" width="40" height="28" rx="9"/>
      <rect x="205" y="307" width="40" height="28" rx="9"/>
      <rect x="327" y="307" width="40" height="28" rx="9"/>
      <rect x="144" y="343" width="40" height="28" rx="9"/>
      <rect x="266" y="343" width="40" height="28" rx="9"/>
    </g>
  </g>

  <!-- Needle with trailing thread -->
  <line x1="352" y1="168" x2="196" y2="344" stroke="#475569" stroke-width="27" stroke-linecap="round"/>
  <line x1="352" y1="168" x2="196" y2="344" stroke="url(#needleGrad)" stroke-width="18" stroke-linecap="round"/>
  <ellipse cx="331" cy="191" rx="7" ry="14" transform="rotate(42 331 191)" fill="#1e293b"/>
  <path d="M 331 191 C 384 232 402 292 372 356" fill="none" stroke="#22d3ee" stroke-width="9" stroke-linecap="round"/>

  <!-- Sparkles -->
  <g fill="#ffffff">
    <path opacity="0.95" transform="translate(412 112) scale(20)" d="M0,-1 C0.1,-0.3 0.3,-0.1 1,0 C0.3,0.1 0.1,0.3 0,1 C-0.1,0.3 -0.3,0.1 -1,0 C-0.3,-0.1 -0.1,-0.3 0,-1 Z"/>
    <path opacity="0.8" transform="translate(70 302) scale(14)" d="M0,-1 C0.1,-0.3 0.3,-0.1 1,0 C0.3,0.1 0.1,0.3 0,1 C-0.1,0.3 -0.3,0.1 -1,0 C-0.3,-0.1 -0.1,-0.3 0,-1 Z"/>
    <path opacity="0.85" transform="translate(424 366) scale(16)" d="M0,-1 C0.1,-0.3 0.3,-0.1 1,0 C0.3,0.1 0.1,0.3 0,1 C-0.1,0.3 -0.3,0.1 -1,0 C-0.3,-0.1 -0.1,-0.3 0,-1 Z"/>
  </g>
</svg>
